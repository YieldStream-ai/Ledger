name: CI/CD

# PRs: tests + Terraform checks (no AWS access).
# Push to main: same checks, then deploy (Terraform apply → image build → Lambda update → health check).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  APP_NAME: yieldstream-ledger
  TF_VERSION: 1.17.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/ -q

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra
      # -backend=false: validate syntax and references without touching AWS or state
      - run: terraform -chdir=infra init -backend=false -input=false && terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, terraform-check]
    runs-on: ubuntu-latest
    environment: production # the deploy role trusts only this environment (infra/ci.tf)
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never kill an apply halfway through
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    env:
      TF_VAR_google_ai_api_key: ${{ secrets.GOOGLE_AI_API_KEY }}
      TF_VAR_llama_cloud_api_key: ${{ secrets.LLAMA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # An empty secret would make Terraform wipe the keys from the Lambda env vars
      - name: Check secrets are set
        run: |
          [ -n "$TF_VAR_google_ai_api_key" ] || { echo "::error::GOOGLE_AI_API_KEY secret is missing"; exit 1; }
          [ -n "$TF_VAR_llama_cloud_api_key" ] || { echo "::error::LLAMA_CLOUD_API_KEY secret is missing"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # plain stdout so `terraform output -raw` works

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${APP_NAME}"
          docker build --provenance=false -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lambda
        run: |
          for fn in "$APP_NAME" "$APP_NAME-worker"; do
            aws lambda update-function-code --function-name "$fn" --image-uri "${{ steps.image.outputs.uri }}" --no-cli-pager > /dev/null
          done
          for fn in "$APP_NAME" "$APP_NAME-worker"; do
            aws lambda wait function-updated-v2 --function-name "$fn"
          done

      - name: Health check
        run: |
          API_URL="$(terraform -chdir=infra output -raw api_url)"
          curl -fsS --retry 3 --retry-delay 5 "${API_URL}health"
          echo
          echo "Deployed ${GITHUB_SHA} to ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
