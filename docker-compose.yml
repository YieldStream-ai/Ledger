services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8100:8100"
    env_file:
      - .env
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - API_TARGET=http://backend:8100
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
